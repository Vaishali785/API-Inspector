<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Console Fix</title>
		<link href="./popup.css" rel="stylesheet" />
	</head>
	<body>
		<div class="popup">
			<h1>API Inspector</h1>
			<p class="subtitle">Track API schema changes in real-time.</p>
			<div class="divider"></div>

			<div class="card">
				<label>API URL Patterns</label>
				<input id="api-patterns" placeholder="/api/, /graphql, /v1/" />
				<p class="hint">Example: /api/, /backend, /rest/v1</p>

				<label class="checkbox">
					<input type="checkbox" id="track-all" />
					Track all JSON APIs
				</label>

				<button class="primary" id="save">Save Settings</button>
				<p class="note">Note: Only HTTP 200 APIs are tracked.</p>
				<div id="status" class="status"></div>
			</div>

			<div class="divider dark"></div>

			<div class="help">
				<h3>How to use</h3>
				<ol>
					<li>Open DevTools</li>
					<li>Go to API Inspector</li>
				</ol>
			</div>
		</div>
		<script src="./popup.js"></script>
	</body>
</html>
